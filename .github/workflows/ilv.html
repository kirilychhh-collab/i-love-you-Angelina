<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Heart Landing</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@400;600&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
  <style>
    :root {
      --font-sans: "Inter", ui-sans-serif, system-ui, sans-serif;
      --font-mono: "Fira Code", monospace;
      --font-display: "Space Grotesk", sans-serif;

      --color-pink-soft: #ff8fb1;
      --color-pink-deep: #ff4d6d;
      --color-brand-red: #ff003c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #050505;
      color: #ffffff;
      font-family: var(--font-mono);
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }

    ::selection {
      background: rgba(255, 0, 60, 0.3);
    }

    /* Эффект сканирующей линии с 1-го скриншота */
    .scanline {
      width: 100%;
      height: 100px;
      z-index: 10;
      background: linear-gradient(
        0deg,
        rgba(0, 0, 0, 0) 0%,
        rgba(255, 255, 255, 0.03) 50%,
        rgba(0, 0, 0, 0) 100%
      );
      opacity: 0.4;
      position: absolute;
      bottom: 100%;
      pointer-events: none;
      animation: scanline 8s linear infinite;
    }

    @keyframes scanline {
      0% { bottom: 100%; }
      100% { bottom: -100px; }
    }

    /* Стартовый экран (2-й скриншот) */
    #intro-screen {
      position: relative;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 18px;
      padding: 24px;
      transition: opacity 0.7s ease, transform 0.7s ease;
    }

    #intro-screen.hidden {
      opacity: 0;
      transform: scale(0.95);
      pointer-events: none;
    }

    .system-line {
      color: var(--color-pink-deep);
      font-size: clamp(13px, 2vw, 16px);
      letter-spacing: 0.5px;
    }

    .terminal-cursor {
      border-right: 2px solid var(--color-pink-deep);
      padding-right: 4px;
      animation: blink 1s step-end infinite;
    }

    @keyframes blink {
      from, to { border-color: transparent; }
      50% { border-color: var(--color-pink-deep); }
    }

    .package-line {
      color: #d4d4d8;
      font-size: clamp(13px, 2vw, 15px);
    }

    .decrypt-btn {
      margin-top: 6px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background-color: var(--color-brand-red);
      color: #ffffff;
      border: none;
      padding: 13px 26px;
      font-family: var(--font-mono);
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 1.5px;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(255, 0, 60, 0.45);
      transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
    }

    .decrypt-btn:hover {
      background-color: #ff1a50;
      box-shadow: 0 0 35px rgba(255, 0, 60, 0.75);
      transform: translateY(-1px);
    }

    .decrypt-btn:active {
      transform: scale(0.97);
    }

    .hint-text {
      color: #71717a;
      font-size: 12px;
      margin-top: -4px;
    }

    /* Сцена с 3D-сердцем (3-й скриншот) */
    #heart-scene {
      position: fixed;
      inset: 0;
      opacity: 0;
      pointer-events: none;
      transition: opacity 1.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #heart-scene.active {
      opacity: 1;
      pointer-events: auto;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Центральная надпись Love you. */
    .center-title {
      position: absolute;
      z-index: 5;
      font-family: var(--font-sans);
      font-weight: 600;
      font-size: clamp(32px, 5.5vw, 54px);
      color: #ffffff;
      letter-spacing: -0.02em;
      pointer-events: none;
      text-shadow:
        0 0 12px rgba(255, 77, 109, 0.85),
        0 0 28px rgba(255, 0, 60, 0.65),
        0 2px 10px rgba(0, 0, 0, 0.9);
      opacity: 0;
      transform: scale(0.85);
      transition: opacity 1.4s ease 0.4s, transform 1.4s ease 0.4s;
    }

    #heart-scene.active .center-title {
      opacity: 1;
      transform: scale(1);
    }
  </style>
</head>
<body>
  <div class="scanline"></div>

  <!-- Экран 1: Кнопка расшифровки -->
  <div id="intro-screen">
    <div class="system-line">
      <span id="typed-text"></span><span class="terminal-cursor"></span>
    </div>
    <div class="package-line">&gt; One encrypted package found for you</div>
    <button class="decrypt-btn" id="decrypt-btn">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
      </svg>
      DECRYPT MESSAGE
    </button>
    <div class="hint-text">(or just click anywhere)</div>
  </div>

  <!-- Экран 2: 3D-сердце из фраз i love you -->
  <div id="heart-scene">
    <canvas id="canvas"></canvas>
    <div class="center-title">Love you.</div>
  </div>

  <script>
    // 1. Эффект печатной машинки для системной строки
    const systemText = "[system] Initializing heart.PROTOCOL_v2.0...";
    const typedEl = document.getElementById("typed-text");
    let charIdx = 0;

    function typeWriter() {
      if (charIdx < systemText.length) {
        typedEl.textContent += systemText.charAt(charIdx);
        charIdx++;
        setTimeout(typeWriter, 32);
      }
    }
    typeWriter();

    // 2. Переключение экранов при клике на кнопку или в любое место
    const introScreen = document.getElementById("intro-screen");
    const heartScene = document.getElementById("heart-scene");
    let started = false;

    function startHeartAnimation() {
      if (started) return;
      started = true;
      introScreen.classList.add("hidden");
      setTimeout(() => {
        heartScene.classList.add("active");
        initCanvas();
      }, 350);
    }

    document.getElementById("decrypt-btn").addEventListener("click", (e) => {
      e.stopPropagation();
      startHeartAnimation();
    });
    document.body.addEventListener("click", startHeartAnimation);

    // 3. Генерация объёмного 3D-сердца из текста "i love you"
    function initCanvas() {
      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d");

      let width = (canvas.width = window.innerWidth);
      let height = (canvas.height = window.innerHeight);

      window.addEventListener("resize", () => {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      });

      const particles = [];
      const layers = 14; // Слои по глубине Z для объёма
      const pointsPerLayer = 48; // Плотность текста по контуру

      for (let l = 0; l < layers; l++) {
        // Нормализованная глубина от -1 до 1
        const zNorm = (l / (layers - 1)) * 2 - 1;
        // Сужаем контур к передней и задней граням, чтобы сердце было выпуклым
        const shellScale = Math.sqrt(Math.max(0.05, 1 - zNorm * zNorm * 0.85));

        for (let i = 0; i < pointsPerLayer; i++) {
          // Пропускаем часть точек внутри, чтобы не было каши
          if (Math.abs(zNorm) < 0.7 && i % 2 !== 0) continue;

          const t = (i / pointsPerLayer) * Math.PI * 2;
          // Классическая параметрическая формула сердца
          const hx = 16 * Math.pow(Math.sin(t), 3);
          const hy = -(
            13 * Math.cos(t) -
            5 * Math.cos(2 * t) -
            2 * Math.cos(3 * t) -
            Math.cos(4 * t)
          );

          particles.push({
            x: hx * shellScale,
            y: hy * shellScale,
            z: zNorm * 8.5,
            scaleFactor: shellScale
          });
        }
      }

      let angleY = 0;
      let time = 0;

      function render() {
        ctx.clearRect(0, 0, width, height);

        time += 0.035;
        angleY += 0.012; // Плавное вращение вокруг вертикальной оси

        // Лёгкая пульсация (сердцебиение)
        const beat = 1 + Math.pow(Math.sin(time * 2.2), 4) * 0.045;
        const baseScale = (Math.min(width, height) / 40) * beat;

        const cosY = Math.cos(angleY);
        const sinY = Math.sin(angleY);

        // Проецируем 3D-координаты на 2D-экран и сортируем по глубине
        const projected = particles.map((p) => {
          const rx = p.x * cosY - p.z * sinY;
          const rz = p.x * sinY + p.z * cosY;

          const perspective = 36 / (36 + rz);
          const screenX = width / 2 + rx * baseScale * perspective;
          const screenY = height / 2 + p.y * baseScale * perspective - 10;

          return {
            screenX,
            screenY,
            rz,
            perspective
          };
        });

        // Сортировка от дальних слоёв к ближним
        projected.sort((a, b) => b.rz - a.rz);

        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        for (const pt of projected) {
          // Чем ближе текст к экрану, тем он ярче и крупнее
          const depthRatio = Math.max(0, Math.min(1, (14 - pt.rz) / 28));
          const fontSize = Math.max(9, Math.round(13.5 * pt.perspective));
          const alpha = 0.22 + depthRatio * 0.78;

          ctx.font = `500 ${fontSize}px "Fira Code", monospace`;

          if (depthRatio > 0.65) {
            ctx.fillStyle = `rgba(255, 135, 165, ${alpha})`;
            ctx.shadowColor = "rgba(255, 0, 60, 0.85)";
            ctx.shadowBlur = 10;
          } else {
            ctx.fillStyle = `rgba(255, 45, 85, ${alpha})`;
            ctx.shadowBlur = 0;
          }

          ctx.fillText("i love you", pt.screenX, pt.screenY);
        }

        ctx.shadowBlur = 0;
        requestAnimationFrame(render);
      }

      render();
    }
  </script>
</body>
</html>
